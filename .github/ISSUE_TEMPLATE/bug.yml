name: Bug
description: Something else doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: swx version
      description: Output of `swx --version`
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain and OS
      description: Output of `swift --version`, and macOS / Linux distribution
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What happened, with `-v` output if relevant
      render: text
