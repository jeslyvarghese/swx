name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Unit tests
        run: swift test
      - name: Differential resolve against SwiftPM
        run: |
          swift build -c release
          mkdir -p /tmp/fixture/Sources/App
          cp Tests/Fixtures/sample/Package.swift /tmp/fixture/
          echo 'print("hi")' > /tmp/fixture/Sources/App/main.swift
          Scripts/compare-with-swiftpm.sh /tmp/fixture .build/release/swx
      - name: Dependency graphs against SwiftPM (and Graphviz)
        run: |
          brew install graphviz
          Scripts/compare-graph.sh .build/release/swx
      - name: Lockfile checks against SwiftPM
        run: Scripts/compare-lock-check.sh .build/release/swx
      - name: Local binary targets against SwiftPM
        run: Scripts/compare-local-artifacts.sh .build/release/swx
      - name: Remote cache round trips, build outputs included
        run: Scripts/check-remote-cache.sh .build/release/swx
      - name: Store and remote pruning, self update
        run: Scripts/check-cache-prune.sh .build/release/swx --self-update
      - name: Monorepos (--all) against SwiftPM
        run: Scripts/check-monorepo.sh .build/release/swx
      - name: add, remove and upgrade against SwiftPM
        run: Scripts/check-manifest-edits.sh .build/release/swx
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Lockfile reuse and submodules against SwiftPM
        run: |
          Scripts/compare-pin-reuse.sh .build/release/swx
          Scripts/compare-submodules.sh .build/release/swx
      - name: Package registries against SwiftPM
        run: Scripts/compare-registry.sh .build/release/swx
      - name: Registry package signatures against SwiftPM
        run: Scripts/compare-registry-signing.sh .build/release/swx
      - name: Publishing to a registry against SwiftPM
        run: Scripts/compare-registry-publish.sh .build/release/swx
      - name: Git tag fingerprints against SwiftPM
        run: Scripts/compare-fingerprints.sh .build/release/swx
      - name: Dynamic AppleProductTypes manifests against Xcode
        run: Scripts/compare-apple-manifest.sh .build/release/swx
      - name: Watch app, widget extension and root package folders against Xcode
        run: Scripts/compare-xcode-apps.sh .build/release/swx
      - name: Registry packages in Xcode projects against xcodebuild
        run: Scripts/compare-xcode-registry.sh .build/release/swx
      - name: Generated Xcode projects build
        run: Scripts/check-xcode-generate.sh .build/release/swx
      - name: Apple platforms (device builds, simulator tests)
        run: Scripts/check-apple-platforms.sh .build/release/swx ios watchos tvos
      # Hosted runners boot visionOS simulators slowly and unreliably, so it is reported, not gating.
      - name: visionOS (device build, simulator tests)
        continue-on-error: true
        timeout-minutes: 30
        run: Scripts/check-apple-platforms.sh .build/release/swx visionos

  benchmarks:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Benchmark against SwiftPM
        run: |
          swift build -c release
          python3 -I Scripts/benchmark.py Tests/Fixtures/sample --swx .build/release/swx --runs 3 --json benchmark.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Workflow against SwiftPM
        run: |
          swift build -c release
          mkdir -p /work/Sources/App
          cp Tests/Fixtures/sample/Package.swift Tests/Fixtures/sample/greet.swift /work/
          echo 'print("hi")' > /work/Sources/App/main.swift
          SWX="$PWD/.build/release/swx" Scripts/linux/workflow.sh
      - name: Git LFS dependencies against SwiftPM
        run: SWX="$PWD/.build/release/swx" Scripts/linux/lfs-check.sh
      - name: Package registries against SwiftPM
        run: |
          apt-get update -qq && apt-get install -y -qq python3
          Scripts/compare-registry.sh .build/release/swx
      - name: Remote cache round trips, build outputs included
        run: Scripts/check-remote-cache.sh .build/release/swx
      - name: Store and remote pruning, self update
        run: Scripts/check-cache-prune.sh .build/release/swx --self-update

  # The setup action in this repository, installing a published release.
  action:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: pinned
        uses: ./
        with:
          version: v0.3.0
      - name: The pinned release is on the PATH
        run: |
          [ "${{ steps.pinned.outputs.version }}" = "0.3.0" ]
          [ "$(swx --version)" = "0.3.0" ]
      - id: latest
        uses: ./
        with:
          install-dir: ${{ runner.temp }}/swx-latest
      - name: The latest release installs
        run: '"$RUNNER_TEMP/swx-latest/swx" --version'
      # The repository is its own tap; Formula/swx.rb names the latest release.
      - name: Homebrew installs the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! command -v brew >/dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap jeslyvarghese/swx "$GITHUB_WORKSPACE"
          brew install jeslyvarghese/swx/swx
          brew test jeslyvarghese/swx/swx
          [ "$("$(brew --prefix)/bin/swift-x" --version)" = "$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/swx.rb)" ]

  static-linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install the Static Linux SDK
        # Checksum of the published 0.1.0 bundle, measured when it was adopted.
        run: swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
        env:
          STATIC_SDK_URL: https://download.swift.org/swift-6.4.1-release/static-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
          STATIC_SDK_CHECKSUM: cef5592d7430ed3c5ae1ddda479849c6f5252bd94a5723db1559f984caf38a7c
      - name: Build a fully static binary
        run: Scripts/build-linux-static.sh x86_64
